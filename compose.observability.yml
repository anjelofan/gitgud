name: gitgud-obs

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.91.0
    restart: always
    # Upstream image has no *_FILE secret support (openobserve/openobserve#5205),
    # so bridge the mounted secrets into the env vars OpenObserve reads.
    entrypoint:
      - /bin/sh
      - -c
      - export ZO_ROOT_USER_EMAIL="$$(cat /run/secrets/oo_root_email)" && export ZO_ROOT_USER_PASSWORD="$$(cat /run/secrets/oo_root_password)" && exec /openobserve
    environment:
      ZO_HTTP_PORT: '5080'
    secrets:
      - oo_root_email
      - oo_root_password
    volumes:
      - openobserve-data:/data
    ports:
      - host_ip: 127.0.0.1
        published: 5080
        target: 5080
        protocol: tcp
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5080/healthz']
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s

secrets:
  oo_root_email:
    file: ${OPENOBSERVE_SECRETS_DIR:-./openobserve/secrets/dev}/root_user_email
  oo_root_password:
    file: ${OPENOBSERVE_SECRETS_DIR:-./openobserve/secrets/dev}/root_user_password

volumes:
  openobserve-data:
